<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tailwind Grid Overlay</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <main class="popup">
            <div class="heading">
                <div class="logo" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
                <div>
                    <h1>Tailwind Grid Overlay</h1>
                    <p>12 columns · 4/16 px grid</p>
                </div>
            </div>

            <button
                class="toggle"
                id="toggle"
                type="button"
                aria-pressed="false"
            >
                <span class="toggle__indicator" aria-hidden="true"></span>
                <span class="toggle__label">Enable grid</span>
            </button>

            <details class="settings">
                <summary>Settings</summary>
                <div class="settings__content">
                    <div class="settings__row settings__row--two">
                        <label>
                            <span>Columns</span>
                            <input
                                id="columns"
                                type="number"
                                min="1"
                                max="24"
                                step="1"
                            />
                        </label>
                        <label>
                            <span>Gap, px</span>
                            <input
                                id="gap"
                                type="number"
                                min="0"
                                max="96"
                                step="1"
                            />
                        </label>
                    </div>

                    <label>
                        <span>Container selector</span>
                        <input
                            id="containerSelector"
                            type="text"
                            spellcheck="false"
                            placeholder=".container"
                        />
                    </label>

                    <label class="range-label">
                        <span>Column opacity</span>
                        <output id="columnOpacityValue">12%</output>
                        <input
                            id="columnOpacity"
                            type="range"
                            min="0"
                            max="50"
                            step="1"
                        />
                    </label>

                    <div class="checks">
                        <label
                            ><input id="showColumns" type="checkbox" />
                            Columns</label
                        >
                        <label
                            ><input id="showGrid16" type="checkbox" /> 16 px
                            grid</label
                        >
                        <label
                            ><input id="showGrid4" type="checkbox" /> 4 px
                            grid</label
                        >
                    </div>

                    <button class="reset" id="reset" type="button">
                        Reset
                    </button>
                </div>
            </details>

            <p class="status" id="status" role="status" aria-live="polite"></p>
        </main>

        <script src="popup.js"></script>
    </body>
</html>
